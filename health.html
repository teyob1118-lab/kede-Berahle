<!DOCTYPE html>
<html>
<head>
<title>Health</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<h2>Health Facilities</h2>
<table id="table"></table>

<script>
fetch("http://127.0.0.1:8000/health")
.then(res => res.json())
.then(data => {
  if(data.length === 0){
    document.getElementById("table").innerHTML = "No data available";
    return;
  }

  let cols = Object.keys(data[0]);
  let table = "<tr>";
  cols.forEach(c => table += `<th>${c}</th>`);
  table += "</tr>";

  data.forEach(row => {
    table += "<tr>";
    cols.forEach(c => table += `<td>${row[c]}</td>`);
    table += "</tr>";
  });

  document.getElementById("table").innerHTML = table;
});
</script>

</body>
</html>
